<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đánh giá K</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đánh giá K">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8102e">

<link rel="apple-touch-icon" href="icon1.png">
<link rel="icon" href="icon1.png">

<style>
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f6f8fc; /* khớp màu nền --paper thật của app K, tránh lộ viền lạ */
  }
  iframe{
    border:none;
    width:100%;
    min-height:100vh;
    display:block;
  }
  #loader{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#1a2744,#2563eb);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:opacity .35s ease;
  }
  #loader img{
    width:84px;height:84px;border-radius:20px;
    margin-bottom:16px;
    box-shadow:0 10px 28px rgba(0,0,0,.4);
    animation:pulse 1.6s ease-in-out infinite;
  }
  #loader .name{
    color:#fff;font-weight:800;font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    margin-bottom:22px;letter-spacing:.02em;
  }
  #loader .spin{
    width:26px;height:26px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  #loader.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
  <div id="loader">
    <img src="icon1.png" alt="Đánh giá K">
    <div class="name">Đánh giá K - THKC</div>
    <div class="spin"></div>
  </div>

  <iframe id="app" src="https://script.google.com/macros/s/AKfycbyIG_xvjMUFA3nWC_hSEdj0jgcJinrNnEcMAFHRJH5IZpHtU6JQ6d39lqtmZgHkVyZZ/exec" allow="fullscreen"></iframe>

  <noscript>
    <p style="color:#fff;text-align:center;padding-top:40px;font-family:sans-serif">
      <a style="color:#fff" href="https://script.google.com/macros/s/AKfycbyIG_xvjMUFA3nWC_hSEdj0jgcJinrNnEcMAFHRJH5IZpHtU6JQ6d39lqtmZgHkVyZZ/exec">Bấm vào đây để mở ứng dụng</a>
    </p>
  </noscript>

  <script>
    var l = document.getElementById('loader');
    setTimeout(function(){ l.classList.add('hide'); }, 500);
  </script>
</body>
</html>
