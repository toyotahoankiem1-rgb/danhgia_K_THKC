<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đánh giá K</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đánh giá K">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14213d">

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:#14213d; /* đồng bộ với màu header của app thật, tránh lệch màu */
  }
  iframe{
    position:fixed;
    inset:0;
    border:none;
    width:100%;
    height:100dvh; /* dvh thay vì % để tính đúng vùng an toàn trên iPhone */
    display:block;
  }
  #loader{
    position:fixed;
    inset:0;
    background:#14213d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:opacity .35s ease;
  }
  #loader img{
    width:88px;height:88px;border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #loader .spin{
    width:28px;height:28px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  #loader.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
  <div id="loader">
    <img src="icon.png" alt="Đánh giá K">
    <div class="spin"></div>
  </div>

  <iframe id="app" src="https://script.google.com/macros/s/AKfycbyIG_xvjMUFA3nWC_hSEdj0jgcJinrNnEcMAFHRJH5IZpHtU6JQ6d39lqtmZgHkVyZZ/exec" allow="fullscreen"></iframe>

  <noscript>
    <p style="color:#fff;text-align:center;padding-top:40px;font-family:sans-serif">
      <a style="color:#fff" href="https://script.google.com/macros/s/AKfycbyIG_xvjMUFA3nWC_hSEdj0jgcJinrNnEcMAFHRJH5IZpHtU6JQ6d39lqtmZgHkVyZZ/exec">Bấm vào đây để mở ứng dụng</a>
    </p>
  </noscript>

  <script>
    var l = document.getElementById('loader');
    // Chỉ che trong thời gian rất ngắn để tránh nháy màu ban đầu,
    // sau đó để app tự hiện dần ra như bình thường thay vì chờ tải xong hẳn
    setTimeout(function(){ l.classList.add('hide'); }, 500);
  </script>
</body>
</html>
